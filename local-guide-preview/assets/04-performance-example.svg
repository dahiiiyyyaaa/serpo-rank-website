<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Performance: targets and diagnosis</title><desc id="desc">Good thresholds from web.dev. Assess mobile and desktop separately.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58755d"/></marker></defs><rect width="1200" height="760" fill="#f5f2e9"/><text x="54" y="55" font-family="Arial, sans-serif" font-size="18" fill="#58755d" font-weight="700">SERPO RANK  /  FIELD GUIDE</text><text x="54" y="112" font-family="Arial, sans-serif" font-size="38" fill="#17211a" font-weight="700">Performance: targets and diagnosis</text><text x="54" y="153" font-family="Arial, sans-serif" font-size="22" fill="#5d665e" font-weight="400">Good thresholds from web.dev. Assess mobile and desktop separately.</text><rect x="54" y="205" width="1092" height="400" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="85" y="250" font-family="Arial, sans-serif" font-size="21" fill="#58755d" font-weight="700">METRIC</text><text x="400" y="250" font-family="Arial, sans-serif" font-size="21" fill="#58755d" font-weight="700">GOOD AT p75</text><text x="745" y="250" font-family="Arial, sans-serif" font-size="21" fill="#58755d" font-weight="700">INVENTED EXAMPLE</text><text x="85" y="325" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">LCP · main content</text><text x="400" y="325" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">≤ 2.5 seconds</text><text x="745" y="325" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">4.2 seconds</text><text x="85" y="420" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">INP · responsiveness</text><text x="400" y="420" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">≤ 200 milliseconds</text><text x="745" y="420" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">280 milliseconds</text><text x="85" y="515" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">CLS · layout stability</text><text x="400" y="515" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">≤ 0.1</text><text x="745" y="515" font-family="Arial, sans-serif" font-size="26" fill="#202821" font-weight="400">0.18</text><text x="75" y="654" font-family="Arial, sans-serif" font-size="24" fill="#202821" font-weight="400">Example values are hypothetical, not a PageSpeed test.</text><text x="75" y="688" font-family="Arial, sans-serif" font-size="24" fill="#202821" font-weight="400">Compare real-user and lab evidence before deciding what to fix.</text><text x="54" y="730" font-family="Arial, sans-serif" font-size="17" fill="#5d665e" font-weight="400">Original editorial diagram · Research reviewed October 28, 2026</text></svg>