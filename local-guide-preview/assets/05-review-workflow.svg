<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">A reliable review-request workflow</title><desc id="desc">Simple native workflows can be enough; connect systems only as needed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58755d"/></marker></defs><rect width="1200" height="1100" fill="#f5f2e9"/><text x="54" y="55" font-family="Arial, sans-serif" font-size="18" fill="#58755d" font-weight="700">SERPO RANK  /  FIELD GUIDE</text><text x="54" y="112" font-family="Arial, sans-serif" font-size="38" fill="#17211a" font-weight="700">A reliable review-request workflow</text><text x="54" y="153" font-family="Arial, sans-serif" font-size="22" fill="#5d665e" font-weight="400">Simple native workflows can be enough; connect systems only as needed.</text><rect x="80" y="190" width="1040" height="112" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="110" y="230" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">1  Record the booking</text><text x="110" y="268" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">Website, phone, or other supported channel → CRM record</text><path d="M600,305 L600,325" stroke="#58755d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="330" width="1040" height="112" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="110" y="370" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">2  Confirm work is completed</text><text x="110" y="408" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">Staff status prevents requests for canceled or unfinished jobs</text><path d="M600,445 L600,465" stroke="#58755d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="470" width="1040" height="112" rx="16" fill="#dfe8db" stroke="#d3dbd1"/><text x="110" y="510" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">3  Check eligibility and send history</text><text x="110" y="548" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">Communication preferences, opt-outs, duplicates, frequency</text><path d="M600,585 L600,605" stroke="#58755d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="610" width="1040" height="112" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="110" y="650" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">4  Send an optional, honest-review request</text><text x="110" y="688" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">No incentives, sentiment filtering, rating targets, or pressure</text><path d="M600,725 L600,745" stroke="#58755d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="750" width="1040" height="112" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="110" y="790" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">5  Customer decides independently</text><text x="110" y="828" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">Published review notification only when supported</text><path d="M600,865 L600,885" stroke="#58755d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="890" width="1040" height="112" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="110" y="930" font-family="Arial, sans-serif" font-size="28" fill="#202821" font-weight="700">6  Draft a reply for human approval</text><text x="110" y="968" font-family="Arial, sans-serif" font-size="23" fill="#202821" font-weight="400">Protect privacy; track delivery and follow-up performance</text><text x="54" y="1070" font-family="Arial, sans-serif" font-size="17" fill="#5d665e" font-weight="400">Original editorial diagram · Research reviewed October 28, 2026</text></svg>