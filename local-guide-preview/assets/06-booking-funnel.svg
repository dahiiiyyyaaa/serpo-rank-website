<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From search visits to completed jobs</title><desc id="desc">All numbers are hypothetical. They are not benchmarks or client results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58755d"/></marker></defs><rect width="1200" height="760" fill="#f5f2e9"/><text x="54" y="55" font-family="Arial, sans-serif" font-size="18" fill="#58755d" font-weight="700">SERPO RANK  /  FIELD GUIDE</text><text x="54" y="112" font-family="Arial, sans-serif" font-size="38" fill="#17211a" font-weight="700">From search visits to completed jobs</text><text x="54" y="153" font-family="Arial, sans-serif" font-size="22" fill="#5d665e" font-weight="400">All numbers are hypothetical. They are not benchmarks or client results.</text><rect x="54" y="190" width="1092" height="86" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="82" y="245" font-family="Arial, sans-serif" font-size="38" fill="#202821" font-weight="700">600</text><text x="209" y="243" font-family="Arial, sans-serif" font-size="27" fill="#202821" font-weight="400">organic visits</text><text x="886" y="242" font-family="Arial, sans-serif" font-size="20" fill="#58755d" font-weight="400">Starting cohort</text><rect x="119" y="295" width="962" height="86" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="147" y="350" font-family="Arial, sans-serif" font-size="38" fill="#202821" font-weight="700">30</text><text x="274" y="348" font-family="Arial, sans-serif" font-size="27" fill="#202821" font-weight="400">inquiries</text><text x="821" y="347" font-family="Arial, sans-serif" font-size="20" fill="#58755d" font-weight="400">5% of visits</text><rect x="184" y="400" width="832" height="86" rx="16" fill="#fff" stroke="#d3dbd1"/><text x="212" y="455" font-family="Arial, sans-serif" font-size="38" fill="#202821" font-weight="700">24</text><text x="339" y="453" font-family="Arial, sans-serif" font-size="27" fill="#202821" font-weight="400">qualified inquiries</text><text x="756" y="452" font-family="Arial, sans-serif" font-size="20" fill="#58755d" font-weight="400">80% of inquiries</text><rect x="249" y="505" width="702" height="86" rx="16" fill="#dfe8db" stroke="#d3dbd1"/><text x="277" y="560" font-family="Arial, sans-serif" font-size="38" fill="#202821" font-weight="700">12</text><text x="404" y="558" font-family="Arial, sans-serif" font-size="27" fill="#202821" font-weight="400">completed first jobs</text><text x="691" y="557" font-family="Arial, sans-serif" font-size="20" fill="#58755d" font-weight="400">50% of qualified inquiries</text><text x="200" y="669" font-family="Arial, sans-serif" font-size="34" fill="#202821" font-weight="700">12 jobs × $180 assumed value = $2,160</text><text x="274" y="704" font-family="Arial, sans-serif" font-size="22" fill="#202821" font-weight="400">First-job revenue, before service and acquisition costs</text><text x="54" y="730" font-family="Arial, sans-serif" font-size="17" fill="#5d665e" font-weight="400">Original editorial diagram · Research reviewed October 28, 2026</text></svg>